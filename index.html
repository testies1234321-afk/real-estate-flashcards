<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Estate Flashcards</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--accent:#1f6feb;--line:#e3e2de}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c1f;--ink:#f1f1f3;--muted:#9a9aa2;--accent:#58a6ff;--line:#2c2c31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px calc(var(--barh,200px) + 24px)}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
ol{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
li{padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;display:flex;gap:10px}
li:first-child{border-top:0}
li.now{background:color-mix(in srgb,var(--accent) 14%,transparent)}
li .n{color:var(--muted);min-width:4.2em;font-variant-numeric:tabular-nums}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:720px;margin:0 auto}
.np{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np small{display:block;font-weight:400;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.ctl button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}
.ctl button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ctl #play{min-width:72px}
audio{display:none}
progress{width:100%;height:4px;margin-top:8px;accent-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Real Estate Pre-License Flashcards</h1>
  <p class="sub">Each track reads the front, pauses, then reads the back. Pick a chapter or All, then press Shuffle.</p>
  <div class="chips" id="chips"></div>
  <ol id="list"></ol>
</main>
<div class="bar" id="bar"><div class="in">
  <div class="np" id="np">Pick a track<small>&nbsp;</small></div>
  <progress id="prog" value="0" max="1"></progress>
  <div class="ctl">
    <button id="prev" aria-label="Previous">&#9198;</button>
    <button id="play">Play</button>
    <button id="next" aria-label="Next">&#9197;</button>
    <button id="shuf">Shuffle</button>
    <button id="loop">Repeat</button>
  </div>
</div></div>
<audio id="a" preload="auto"></audio>
<script>
const $=id=>document.getElementById(id), A=$('a');
const fitBar=()=>document.documentElement.style.setProperty("--barh",$("bar").offsetHeight+"px");
if(window.ResizeObserver)new ResizeObserver(fitBar).observe($("bar"));addEventListener("resize",fitBar);fitBar();
let all=[], chapter='all', queue=[], pos=-1, shuffle=false, loop=true;
try{shuffle=localStorage.getItem('shuf')==='1';chapter=localStorage.getItem('ch')||'all'}catch(e){}
const pool=()=>chapter==='all'?all:all.filter(t=>String(t.ch)===chapter);
function mix(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function build(keep){const cur=queue[pos];queue=shuffle?mix(pool()):pool().slice();
  pos=keep&&cur?queue.indexOf(cur):-1;if(keep&&cur&&pos<0)pos=-1;render()}
function render(){
  const chs=[...new Set(all.map(t=>t.ch))].sort((a,b)=>a-b);
  $('chips').innerHTML=['all',...chs].map(c=>`<button class="chip${String(c)===chapter?' on':''}" data-c="${c}">${c==='all'?'All chapters':'Chapter '+c}</button>`).join('');
  $('list').innerHTML=queue.map((t,i)=>`<li data-i="${i}" class="${i===pos?'now':''}"><span class="n">${t.id||('#'+t.n)}</span><span>${esc(t.front)}</span></li>`).join('');
  $('shuf').classList.toggle('on',shuffle);$('loop').classList.toggle('on',loop);
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function go(i){if(!queue.length)return;
  if(i>=queue.length){if(!loop){A.pause();return}if(shuffle)queue=mix(pool());i=0}
  if(i<0)i=queue.length-1;pos=i;const t=queue[i];A.src=t.src+(t.v?'?v='+t.v:'');A.play().catch(()=>{});
  $('np').innerHTML=`${esc(t.front)}<small>Chapter ${t.ch} · ${t.id} · ${i+1} of ${queue.length}</small>`;render();
  const el=document.querySelector('li.now');if(el)el.scrollIntoView({block:'nearest'});
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.front,artist:'Chapter '+t.ch,album:'Real Estate Flashcards'});
}
$('chips').onclick=e=>{const c=e.target.dataset.c;if(!c)return;chapter=c;try{localStorage.setItem('ch',c)}catch(_){};A.pause();build(false);go(0)};
$('list').onclick=e=>{const li=e.target.closest('li');if(li)go(+li.dataset.i)};
$('play').onclick=()=>{if(pos<0)return go(0);A.paused?A.play():A.pause()};
$('next').onclick=()=>go(pos+1);$('prev').onclick=()=>go(pos-1);
$('shuf').onclick=()=>{shuffle=!shuffle;try{localStorage.setItem('shuf',shuffle?'1':'0')}catch(_){};build(true)};
$('loop').onclick=()=>{loop=!loop;render()};
A.onended=()=>go(pos+1);
A.onplay=()=>$('play').textContent='Pause';A.onpause=()=>$('play').textContent='Play';
A.ontimeupdate=()=>{$('prog').max=A.duration||1;$('prog').value=A.currentTime};
if('mediaSession' in navigator){navigator.mediaSession.setActionHandler('nexttrack',()=>go(pos+1));navigator.mediaSession.setActionHandler('previoustrack',()=>go(pos-1))}
fetch('tracks.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(t=>{all=t.sort((a,b)=>a.ch-b.ch||a.s-b.s||a.n-b.n);
  if(chapter!=='all'&&!all.some(x=>String(x.ch)===chapter))chapter='all';build(false)});
</script>
</body>
</html>
